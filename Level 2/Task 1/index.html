<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Flexbox & Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <header class="flex-header">
        <h1>My Gallery Site</h1>
        <nav>
            <ul class="flex-nav">
                <li><a href="#">Home</a></li>
                <li><a href="#">Gallery</a></li>
                <li><a href="#">About</a></li>
            </ul>
        </nav>
    </header>

    
    <main>
        <h2>Latest Photos</h2>
        <div class="grid-gallery">
            <div class="grid-item">Photo 1</div>
            <div class="grid-item">Photo 2</div>
            <div class="grid-item">Photo 3</div>
            <div class="grid-item">Photo 4</div>
            <div class="grid-item">Photo 5</div>
            <div class="grid-item">Photo 6</div>
        </div>
    </main>

    
    <footer class="flex-footer">
        <p>&copy; Web Design Task</p>
    </footer>

</body>
</html>
