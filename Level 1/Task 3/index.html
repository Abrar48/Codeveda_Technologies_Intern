<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactivity to a webpage using JS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <div class="section">
        <h2>1. JavaScript Dropdown</h2>
        <button id="dropdownBtn" class="btn">Click for Menu ▼</button>
        <div id="dropdownContent" class="hidden box">
            <p> Option 1: Brazil</p>
            <p> Option 2: Argentina</p>
        </div>
    </div>

    
    <div class="section">
        <h2>2. JavaScript Modal</h2>
        <button id="openModalBtn" class="btn">Open Modal</button>
    </div>

    
    <div id="myModal" class="modal hidden">
        <div class="modal-content">
            <span id="closeModalBtn" class="close-btn">&times;</span>
            <h3>Hello!</h3>
            <p>It's me Abrar. This is a modal popup created with JavaScript.</p>
        </div>
    </div>

    
    <div class="section">
        <h2>3. Form Validation</h2>
        <form id="myForm" class="form-box">
            <label>Name:</label>
            <input type="text" id="nameInput" placeholder="Enter your name">
            
            <label>Email:</label>
            <input type="email" id="emailInput" placeholder="Enter your email">
            
            <button type="submit" class="btn">Submit</button>
            
            
            <p id="message"></p> 
        </form>
    </div>

    
    <script src="script.js"></script>
</body>
</html>
